<!--
  NAVIGATION SNIPPET FOR index.html
  Adds the same top bar as alerts.html, so people can move between Logs, Alerts and Runbook.

  How to use it:
    STEP 1: Copy the <style> block below and paste it inside the <head> of index.html
            (put it just before </head>).
    STEP 2: Copy the <header> block and paste it straight after the opening <body> tag.
            Note that class="active" is on "Logs" here, because this is the Logs page.
    STEP 3: Copy the <script> block and paste it just before </body>.
    STEP 4: Save, refresh http://localhost:8000/index.html and click each link.

  Don't change anything else in your index.html. Your table code from Task 1 stays as it is.
-->

<!-- ===== STEP 1: paste inside <head> ===== -->
<style>
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 8px;
    padding: 12px 24px;
    background: #6f4426; color: #ffffff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .topbar .brand { font-weight: 700; letter-spacing: .2px; }
  .topbar nav a {
    color: #ffffff; text-decoration: none;
    padding: 6px 12px; border-radius: 6px; margin-left: 4px;
    opacity: .85;
  }
  .topbar nav a:hover { opacity: 1; background: rgba(255,255,255,.12); }
  .topbar nav a.active { opacity: 1; background: rgba(255,255,255,.2); font-weight: 600; }
</style>

<!-- ===== STEP 2: paste right after <body> ===== -->
<header class="topbar">
  <div class="brand">WoodCraft Log Monitor</div>
  <nav>
    <a href="index.html" class="active">Logs</a>
    <a href="alerts.html">Alerts</a>
    <a href="runbook.md" class="runbook-link">Runbook</a>
  </nav>
</header>

<!-- ===== STEP 3: paste just before </body> ===== -->
<script>
  // On GitHub Pages, runbook.md is published as a web page at runbook.html.
  if (location.hostname.endsWith('github.io')) {
    document.querySelectorAll('.runbook-link').forEach(a => a.href = 'runbook.html');
  }
</script>
