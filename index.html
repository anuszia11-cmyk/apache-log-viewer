<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WoodCraft Security Log Viewer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f4f4f4;
        }

        h1 {
            text-align: center;
        }

        p {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #333;
            color: white;
        }

        tr:nth-child(even) {
            background: #eeeeee;
        }

        .error {
            color: red;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>WoodCraft Security Log Viewer</h1>

    <p>Sample server activity logs</p>

    <table>
        <thead>
            <tr>
                <th>IP Address</th>
                <th>Timestamp</th>
                <th>Request</th>
                <th>Status</th>
                <th>Size</th>
            </tr>
        </thead>

        <tbody id="logTable">
            <tr>
                <td colspan="5">Loading logs...</td>
            </tr>
        </tbody>
    </table>

    <p id="message" class="error"></p>

    <script>
        fetch("./logs.json")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Could not load logs.json");
                }

                return response.json();
            })
            .then(logs => {
                const table = document.getElementById("logTable");

                table.innerHTML = "";

                logs.slice(0, 10).forEach(log => {
                    const row = document.createElement("tr");

                    [
                        log.ip,
                        log.timestamp,
                        log.request,
                        log.status,
                        log.size
                    ].forEach(value => {
                        const cell = document.createElement("td");

                        cell.textContent = value;
                        row.appendChild(cell);
                    });

                    table.appendChild(row);
                });
            })
            .catch(error => {
                document.getElementById("message").textContent =
                    "Error: " + error.message;
            });
    </script>

</body>
</html>
